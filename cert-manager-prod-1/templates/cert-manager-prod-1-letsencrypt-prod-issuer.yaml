---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-prod-1-letsencrypt-prod-issuer
  namespace: cert-manager-prod-1
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "rafal.podkonski@dev-software.pl"
    privateKeySecretRef:
      name: cert-manager-prod-1-letsencrypt-prod-issuer
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-token-secret
            key: CF_TOKEN
      selector:
        dnsZones:
          - "dev-software.pl"
